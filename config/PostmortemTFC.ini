[Main]
; Migrated from the original MouseSpeed=48 (0.00048 radians per unit).
Sensitivity=72
; Original KeySpeed=24 was approximately 240 world units per second.
MoveSpeed=240
; Living-player tfc movement as a percentage of Skyrim's native speed.
; 25 = quarter speed, 100 = unchanged. Applies to shortcut and console tfc.
; Range 1..1000. Restart Skyrim after editing. Death MoveSpeed is separate.
AliveSpeedPercent=100
; Initial orbit distance on death, in game units. 0 keeps the game's distance.
; This does not change scroll-wheel zoom or distance during living ragdolls.
DeathOrbitDistance=180
RunMultiplier=4
WheelStep=8
; Old executable offsets are replaced by Address Library relocations.
; Default death camera: mouse orbit, wheel/W/S zoom, mouse buttons roll.
; MiddleButtonToLRButton remains unsupported.


; DirectInput keyboard scan code: 78 = Numpad +, 0 = disable shortcut.
TFCHotkey=78
; Delay before automatic death reload in seconds (1..86400).
; 0 leaves the game's existing timer unchanged. Restart after editing.
DeathReloadDelaySeconds=60

